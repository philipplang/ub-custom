# image will be published to ghcr.io/<user>/<name>
name: ub-custom-45
# description will be included in the image's metadata
description: A starting point for further customization of uBlue images. Make your own! https://ublue.it/making-your-own/

# the base image to build on top of (FROM) and the version tag to use
base-image: ghcr.io/ublue-os/silverblue-main
image-version: 45 # latest is also supported if you want new updates ASAP

# module configuration, executed in order
# you can include multiple instances of the same module
# Fedora 45: rpm-ostree install no longer works during container builds,
# therefore the dnf module (dnf5) is used instead of rpm-ostree.
modules:
  # RPM Fusion must be installed before v4l2loopback (kmod depends on the v4l2loopback package from RPM Fusion)
  - type: dnf
    install:
      packages:
        - https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-%OS_VERSION%.noarch.rpm
        - https://mirrors.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-%OS_VERSION%.noarch.rpm

  # Workaround for blue-build/modules#597 (akmods module uses rpm-ostree install, fails on F45)
  # Replace with the akmods module again once the fix is merged:
  # - type: akmods
  #   install:
  #       - v4l2loopback
  #       # - VirtualBox
  - type: containerfile
    snippets:
      - >-
        RUN --mount=type=bind,from=ghcr.io/ublue-os/akmods:main-45,src=/rpms,dst=/tmp/akmods-rpms
        dnf5 -y install /tmp/akmods-rpms/kmods/*v4l2loopback*.rpm && dnf5 clean all

  - type: files
    files:
      - destination: /usr
        source: usr
  - type: script@v1
    snippets:
      - "update-ca-trust"

  - type: dnf
    repos:
      copr:
        - tofik/nwg-shell
        - eddsalkield/swaylock-effects
        - scottames/ghostty
        # - kallepm/tuxedo-control-center
        # - kallepm/tuxedo-drivers
        # - solopasha/hyprland
    install:
      packages:
      # gnome
        - gnome-shell-extension-dash-to-dock
        - gnome-shell-extension-user-theme
        - gnome-tweaks
        - libcanberra-gtk3
        - libcanberra-gtk2
      # allgemein
      #  - libreoffice-calc
        - podman-compose
        - thunderbird
        # - VirtualBox
        # - virtualbox-guest-additions
        # - akmod-VirtualBox
        - edk2-ovmf
        - swtpm
        - swtpm-tools
        - virt-manager
        #- gnome-boxes
        - zsh
        - zsh-syntax-highlighting
        - lsd
        - system-config-printer
        - mscore-fonts
        - powertop
        - sshfs
        # - pinta # Bild-Editor: in Fedora 45 nicht mehr als RPM verfuegbar -> Flatpak com.github.PintaProject.Pinta
        - firewall-config
  #      - tuxedo-drivers
  #      - kernel-devel
  #      - tuxedo-control-center
      # Hyprland + Wayland
        #- hyprland
        #- hyprland-plugins
        #- hypridle
        #- hyprlock
        #- waybar
        #- waybar-git # enthaelt neusten Snapshot von waybar.
        - kitty
        - alacritty
        - ghostty
        - wofi
        - rofi
        - dunst
        #- xdg-desktop-portal-hyprland
        - polkit
        - brightnessctl
        - pavucontrol
        - blueman
        - NetworkManager-tui
        - swaybg
        - swayidle
  #      - swaylock-effects
        - wlogout
        - wl-clipboard
        - swappy
        - fontawesome-fonts-all
        - libappindicator-gtk3
        - network-manager-applet
        - swaylock
        - wireguard-tools
        - strace # for debugging Keycloak integration
        - seahorse
        - keepassxc
        #- ulauncher
        - nnn
        - gparted
      # labwc
      #  - labwc
      #  - bemenu
      # sway
  #      - sway
  #      - nwg-shell
      # i3
  #      - i3
        - openfortivpn
        - NetworkManager-fortisslvpn-gnome
        - NetworkManager-strongswan-gnome
        - chromium
        - mutter-devel
        - mutter-devkit
    remove:
      packages:
        - firefox # default firefox removed in favor of flatpak
        - firefox-langpacks # langpacks needs to also be removed to prevent dependency problems
  # - type: dnf
  #   install:
  #     packages:
  #       - bitbox-4.47.2-1.x86_64.rpm
  - type: default-flatpaks
    configurations:
    - notify: true   # Send notification after install/uninstall is finished (true/false)
      scope: system
      repo:
        url: https://dl.flathub.org/repo/flathub.flatpakrepo
        name: flathub
      # repo-title: "Flathub (system-wide)" # Optional; this sets the remote's user-facing name in graphical frontends like GNOME Software
      # install:
      # - org.gnome.Loupe
      # - one.ablaze.floorp//lightning # This is an example of flatpak which has multiple branches in selection (flatpak//branch).
      # Flatpak runtimes are not supported (like org.winehq.Wine//stable-23.08).
      # Only normal flatpak applications are (like Floorp Lightning web browser in this example).
      # Multiple install of same flatpaks with different branches is not supported.
      # remove:
      # - org.gnome.eog
      #
    # A flatpak repo can also be added without having to install flatpaks,
    # as long as one of the repo- fields is present
    - scope: user
      repo:
        url: https://dl.flathub.org/repo/flathub.flatpakrepo
        name: flathub

  - type: default-flatpaks
    configurations:
      - install:
        - com.visualstudio.code
        - org.keepassxc.KeePassXC
        - net.cozic.joplin_desktop
        - com.brave.Browser
        - com.google.Chrome
        - com.mattjakeman.ExtensionManager
        - com.discordapp.Discord
        - info.portfolio_performance.PortfolioPerformance
        - io.podman_desktop.PodmanDesktop
        - com.github.PintaProject.Pinta

  - type: signing

  - type: fonts
    fonts:
      nerd-fonts:
        - Hack
        - SourceCodePro
        - Terminus
        - JetBrainsMono
        - NerdFontsSymbolsOnly